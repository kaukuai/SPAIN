name: Publish to main
# Vercel's production site follows `main`. Work branches pushed by Claude are tested,
# built and then fast-forwarded into `main`, so the same URL updates automatically.
on:
  push:
    branches: ['claude/**']
permissions:
  contents: write
concurrency:
  group: publish-main
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Fast-forward main
        run: |
          if git fetch origin main; then
            git merge-base --is-ancestor origin/main HEAD || { echo "::error::main has commits that are not in ${GITHUB_REF_NAME}; not overwriting it"; exit 1; }
          fi
          git push origin HEAD:main
